# Every version here was checked against live Maven metadata on 2026-09-06, the
# day of the build, rather than copied from a document. Two things that look
# wrong and are not: AGP 9 carries its own Kotlin support, so the
# org.jetbrains.kotlin.android plugin is deliberately absent, and KSP has
# versioned independently of Kotlin since KSP2, so 2.3.11 beside Kotlin 2.4.10
# is correct.

[versions]
agp = "9.4.0"
kotlin = "2.4.10"
ksp = "2.3.11"

# minSdk 29 (Android 10) because the people this is for keep a phone for years.
# compileSdk 37 so the newest APIs are callable behind version checks. targetSdk
# is confirmed against the Play requirement before release; see DECISIONS.md.
minSdk = "29"
compileSdk = "37"
targetSdk = "36"

activityCompose = "1.13.0"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
coroutines = "1.11.0"
datastore = "1.2.1"
# The widget. Glance 1.2.0 is the current stable; 1.3.0 is alpha.
glance = "1.2.0"
# The camera and reading text off a photographed page, both on device. CameraX 1.6.2
# and ML Kit text recognition 16.0.1 are the current stables; the 1.7 line is alpha.
camerax = "1.6.2"
mlkitText = "16.0.1"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
profileinstaller = "1.4.1"
# Room 3, at the androidx.room3 group with room3- prefixed artifacts. Room 2
# stops at 2.8.x and is in maintenance.
room = "3.0.2"
serialization = "1.11.0"
splashscreen = "1.2.0"
sqlcipher = "4.18.0"
sqlite = "2.7.0"
work = "2.11.2"

# Charts. Vico 3 publishes only :compose and :compose-m3.
vico = "3.3.1"

androidxJunit = "1.3.0"
espresso = "3.7.0"
junit = "4.13.2"
mockk = "1.14.11"
robolectric = "4.16.1"
testCore = "1.7.0"
truth = "1.4.5"
turbine = "1.2.1"
uiautomator = "2.4.0"

detekt = "1.23.8"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitText" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-core = { module = "androidx.test:core", version.ref = "testCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testCore" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "testCore" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }

build:
  maxIssues: 0

formatting:
  active: true
  android: true
  MaximumLineLength:
    active: true
    maxLineLength: 110

style:
  MaxLineLength:
    active: true
    maxLineLength: 110
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
  ReturnCount:
    active: true
    # Guard clauses. Each rule in the engine answers one question and returns,
    # which reads as a list of rules; folding them into nested conditions to get
    # the count down would make the precedence between them harder to see, and
    # the precedence is the part that matters.
    max: 6
  UnusedPrivateMember:
    active: true

complexity:
  LongMethod:
    # A composable describes a layout, and a layout is as long as the screen it
    # draws. Splitting one at sixty lines to satisfy a counter produces a helper
    # per section that is called once and read never.
    threshold: 130
  LongParameterList:
    # Compose screens take one callback per action by design, and collapsing
    # them into an object hides which screen uses which.
    functionThreshold: 9
    constructorThreshold: 9
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInClasses: 70
    thresholdInFiles: 70
    # A DAO with fourteen queries is fourteen queries, not fourteen decisions.
    # The count says nothing about whether the interface is doing too much.
    thresholdInInterfaces: 30
    ignorePrivate: true

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

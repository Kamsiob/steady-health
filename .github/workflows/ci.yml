name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. A superseded run tells you about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # JDK 21 because that is what AGP 9 targets and what gradle-env.sh sets
      # locally. The two agreeing is the point: a green CI on a different JDK
      # than the one the build runs on is a green light for nothing.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Detekt
        run: ./gradlew detekt

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 7
